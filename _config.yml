plugins:
  - jekyll-sitemap
  - jekyll-paginate

kramdown:
  auto_ids: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      permalink: /:categories/:name
  - scope:
      path: "assets/img"
    values:
      image: true
  - scope:
      path: ""
    values:
      layout: "default"